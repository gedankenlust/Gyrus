name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pip-audit==2.9.0
      - run: pip-audit -r requirements.txt
      - run: pytest -q

  macos-tests:
    # Both ends of the supported range. macos-14 is the floor advertised in the
    # README, and it is the only automated proof of that claim — building against
    # a newer SDK says nothing about whether Sonoma's older SDK has the APIs.
    name: macOS build and tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: python3 generate_xcodeproj.py
      - run: >-
          xcodebuild test
          -project Gyrus.xcodeproj
          -scheme Gyrus
          -destination 'platform=macOS'
          -derivedDataPath ci-build
          CODE_SIGNING_ALLOWED=NO

      - name: Verify the minimum macOS version has not crept up
        run: |
          set -euo pipefail
          expected=14.0
          plist=Gyrus/Resources/Info.plist
          binary=ci-build/Build/Products/Debug/Gyrus.app/Contents/MacOS/Gyrus

          # Info.plist is what Finder and the App Store check before launching.
          declared=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$plist")
          # minos in the Mach-O header is what dyld actually enforces at runtime.
          # Xcode writes it from MACOSX_DEPLOYMENT_TARGET, so this catches a
          # regenerated project file that lost the setting.
          actual=$(otool -l "$binary" | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')

          echo "LSMinimumSystemVersion: $declared"
          echo "Mach-O minos:           $actual"

          if [ "$declared" != "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Expected macOS $expected everywhere. Info.plist says '$declared' and the binary says '$actual'. Update MACOS_MIN in generate_xcodeproj.py and LSMinimumSystemVersion together, and keep README/GETTING_STARTED/CONTRIBUTING in step."
            exit 1
          fi

  macos-backend-tests:
    # The backend also only ever runs on macOS, and parts of it are
    # platform-specific (0o700/0o600 permissions, SQLite file locking), so the
    # ubuntu run above is not sufficient on its own.
    name: Backend tests on macOS 14
    runs-on: macos-14
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
